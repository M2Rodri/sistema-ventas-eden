org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# El proyecto vive en D:\ y el pub cache de Flutter vive en C:\ (una
# instalación normal de Flutter en Windows). El compilador incremental de
# Kotlin calcula rutas relativas entre los .kt de los plugins (en el pub
# cache, C:) y el proyecto (D:), y esa cuenta no existe entre dos unidades
# de disco distintas: tira "this and base files have different roots" y
# aborta el build. Pasa con cualquier plugin que traiga código Kotlin
# nativo (ej. image_picker). Se desactiva el incremental para evitarlo.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
